[tool.poetry]
name = "cutit-backend"
version = "0.1.0"
description = "Cut It — Privacy-first AI proxy. Local screening, clean data to cloud."
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
httpx = "^0.27.0"
presidio-analyzer = "^2.2.354"
presidio-anonymizer = "^2.2.354"
spacy = "^3.7.0"
pillow = "^10.3.0"
faster-whisper = "^1.0.0"
sounddevice = "^0.4.6"
numpy = "^1.26.0"
scipy = "^1.13.0"
python-multipart = "^0.0.9"
pydantic-settings = "^2.2.1"
ollama = "^0.2.0"
python-dotenv = "^1.0.1"
mediapipe = "^0.10.0"
easyocr = "^1.7.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
